spring:
  application:
    name: todo-user
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:./test;DB_CLOSE_ON_EXIT=TRUE;MODE=PostgreSQL
    username: sa
    password:
  mvc:
    problemdetails:
      enabled: false
  security:
    oauth2:
      authorizationserver:
        client:
          test-client:
            registration:
              client-id: "oidc-client"
              client-secret: "{noop}secret"
              client-authentication-methods:
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
              redirect-uris:
                - "http://127.0.0.1:8080/login/oauth2/code/oidc-client"
              post-logout-redirect-uris:
                - "http://127.0.0.1:8080/"
              scopes:
                - "openid"
                - "profile"
            require-authorization-consent: true
application:
  auth:
    jwt:
      public-key:
      private-key:
  logging:
    request-id-header: "X-REQUEST-ID"
    request-id-key: "request_id"

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    enable:
      hikaricp: true
#logging:
#  structured:
#    format:
#      console: logstash
springdoc:
  api-docs:
    version: openapi_3_0
  cache:
    disabled: true
  use-management-port: true